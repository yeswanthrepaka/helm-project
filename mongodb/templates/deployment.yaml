apiVersion: apps/v1
kind: Deployment

metadata: 
  name: mongodb
  namespace: roboshop
  labels: 
    project: roboshop
    component: mongodb
    tier: database

spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: database

  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: database
    spec:
      containers:
      - name: mongodb
        image: "{{ .Values.deployment.imageName }}:{{ .Values.deployment.imageVersion }}"

